<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Emission Line Rail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:linear-gradient(90deg,#26272a,#2e2f33 40%,#26272a);color:#e9e4d8;font:14px/1.45 'Inter Tight',sans-serif;letter-spacing:.02em}
.rail{position:absolute;left:300px;top:0;bottom:0;width:1px;background:#e9e4d8}
.dest{position:absolute;left:300px;height:1px;background:#e9e4d8}
.dest span{position:absolute;left:12px;top:-9px;white-space:nowrap}
.plate{position:absolute;left:330px;top:40px;width:1070px;height:820px;background:#3a3b3f;display:grid;grid-template-columns:1fr 360px}
.stage{display:flex;align-items:center;justify-content:center;background:#2a2b2e;margin:24px;position:relative}
.d{position:absolute;bottom:16px;left:20px;display:flex;gap:30px}.d b{display:block;font-weight:600;font-size:24px;letter-spacing:0}
.side{padding:28px 26px}
h3{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin:0 0 12px}
.sp{margin-bottom:16px}.sp b{font-weight:600}
.band{position:relative;height:26px;background:#2a2b2e;margin-top:6px}
.band i{position:absolute;top:0;bottom:0;width:1px}
.band i.d2{box-shadow:3px 0 0 currentColor}
.l{display:flex;justify-content:space-between;font-size:11px;color:#a29d92;margin-top:2px}
.state{display:flex;gap:16px;margin-top:20px;font-size:12px}
.go{margin-top:22px;border:1px solid #e9e4d8;padding:11px;text-align:center}
</style></head><body>
<div class="rail"></div>
<div class="dest" style="top:120px;width:22px"><span>MURRINI</span></div>
<div class="dest" style="top:300px;width:8px;opacity:.6"><span>Vessel</span></div>
<div class="dest" style="top:420px;width:8px;opacity:.6"><span>Plan</span></div>
<div class="dest" style="top:540px;width:8px;opacity:.6"><span>Learn</span></div>
<div class="dest" style="top:660px;width:8px;opacity:.6"><span>Saved</span></div>
<div style="position:absolute;left:28px;top:36px;font-weight:600;letter-spacing:.14em">BEFORE THE HEAT</div>
<div class="plate">
 <div class="stage"><svg width="480" height="480" viewBox="-130 -130 260 260"><circle r="116" fill="#1f45a8"/><circle r="108" fill="#f3f1ea"/><circle r="100" fill="#dfe6e2"/>
  <g fill="#f3f1ea" stroke="#1f45a8" stroke-width="3"><ellipse cy="-55" rx="24" ry="38"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(60)"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(120)"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(180)"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(240)"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(300)"/></g>
  <circle r="22" fill="#b0183a"/><circle r="9" fill="#f3f1ea"/></svg>
  <div class="d"><div><b>32 mm</b>gather Ø</div><div><b>8 mm</b>pulled Ø</div><div><b>4 : 1</b>reduction</div></div></div>
 <div class="side"><h3>Colorants · absorption</h3>
  <div class="sp"><b>Cobalt Blue</b> · casing 3<div class="band"><i style="left:56%;background:#6fa8ff;color:#6fa8ff"></i><i style="left:63%;background:#6fa8ff"></i><i style="left:70%;background:#6fa8ff"></i></div><div class="l"><span>400</span><span>nm</span><span>700</span></div></div>
  <div class="sp"><b>Gold Ruby</b> · core · pending strike<div class="band"><i style="left:48%;background:#e0544b;width:2px;border-left:1px dashed #e0544b"></i></div></div>
  <div class="sp"><b>Neodymium</b> · not used<div class="band"><i style="left:62%;background:#e9e4d8"></i><i style="left:64%;background:#e9e4d8"></i><i style="left:34%;background:#e9e4d8"></i></div></div>
  <div class="sp"><b>Cadmium Yellow</b> · toxic<div class="band"><i class="d2" style="left:22%;background:#f5c542;color:#f5c542"></i></div></div>
  <div class="state"><span>━ live</span><span>┄ pending</span><span>═ warning</span></div>
  <div class="go">OPEN SHOP PLAN</div></div>
</div></body></html>
