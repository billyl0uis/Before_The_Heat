<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category Standard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#1c1c1e;color:#f2f2f7;font:14px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
header{height:48px;display:flex;align-items:center;gap:20px;padding:0 16px;background:#2c2c2e;border-bottom:1px solid #3a3a3c}
header a{color:#98989f}header a.on{color:#fff}
main{display:grid;grid-template-columns:56px 1fr 300px;height:852px}
.rail{background:#2c2c2e;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:12px}
.rail i{width:34px;height:34px;border-radius:8px;background:#3a3a3c}.rail i.on{background:#0a84ff}
.canvas{display:flex;align-items:center;justify-content:center;background:#1c1c1e}
.insp{background:#2c2c2e;border-left:1px solid #3a3a3c;padding:14px}
.sec{border-bottom:1px solid #3a3a3c;padding:12px 0}.sec b{display:block;margin-bottom:8px;font-size:12px;color:#98989f;text-transform:uppercase}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.sw i{height:28px;border-radius:6px}
.f{display:flex;justify-content:space-between;padding:6px 0}
.btn{margin-top:14px;background:#0a84ff;border-radius:8px;padding:10px;text-align:center}
</style></head><body>
<header><b>Before The Heat</b><a class="on">Murrini</a><a>Vessel</a><a>Plan</a><a>Learn</a><a>Saved</a></header>
<main><div class="rail"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
<section class="canvas"><svg width="520" height="520" viewBox="-130 -130 260 260"><circle r="116" fill="#1f45a8"/><circle r="108" fill="#f3f1ea"/><circle r="100" fill="#dfe6e2"/>
  <g fill="#f3f1ea" stroke="#1f45a8" stroke-width="3"><ellipse cy="-55" rx="24" ry="38"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(60)"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(120)"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(180)"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(240)"/><ellipse cy="-55" rx="24" ry="38" transform="rotate(300)"/></g>
  <circle r="22" fill="#b0183a"/><circle r="9" fill="#f3f1ea"/></svg></section>
<aside class="insp"><div class="sec"><b>Rod</b><div class="f"><span>Gather Ø</span><span>32 mm</span></div><div class="f"><span>Pulled Ø</span><span>8 mm</span></div><div class="f"><span>Reduction</span><span>4 : 1</span></div></div>
<div class="sec"><b>Casing</b><div class="f"><span>1 Clear</span></div><div class="f"><span>2 Opal White</span></div><div class="f"><span>3 Cobalt Blue</span></div></div>
<div class="sec"><b>Colour</b><div class="sw"><i style="background:#1f45a8"></i><i style="background:#f3f1ea"></i><i style="background:#b0183a"></i><i style="background:#1c9a8f"></i><i style="background:#2e7d32"></i><i style="background:#6a3d8f"></i></div></div>
<div class="btn">Open shop plan</div></aside></main></body></html>
